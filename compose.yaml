name: nornrune

services:
  postgres:
    image: ${POSTGRES_IMAGE:-postgres:19beta3}
    restart: unless-stopped
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: ${POSTGRES_ADMIN_PASSWORD:-nornrune-admin-local}
      POSTGRES_DB: ${POSTGRES_DB:-nornrune}
      NORNRUNE_MIGRATION_PASSWORD: ${NORNRUNE_MIGRATION_PASSWORD:-nornrune-migrator-local}
      NORNRUNE_RUNTIME_PASSWORD: ${NORNRUNE_RUNTIME_PASSWORD:-nornrune-runtime-local}
    ports:
      - "127.0.0.1:${POSTGRES_PORT:-5432}:5432"
    volumes:
      - postgres-data:/var/lib/postgresql
      - ./docker/postgres/init-roles.sh:/docker-entrypoint-initdb.d/10-init-roles.sh:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U \"$${POSTGRES_USER}\" -d \"$${POSTGRES_DB}\""]
      interval: 2s
      timeout: 5s
      retries: 30
    stop_grace_period: 30s

  migrate:
    build:
      context: .
      dockerfile: Dockerfile
    restart: "no"
    command: ["migrate", "--wait"]
    environment:
      NORNRUNE_DATABASE_URL: postgresql://nornrune_migrator:${NORNRUNE_MIGRATION_PASSWORD:-nornrune-migrator-local}@postgres:5432/${POSTGRES_DB:-nornrune}?sslmode=disable
      NORNRUNE_DATABASE_CONNECT_TIMEOUT: 30s
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "/nornrune", "migration-healthcheck"]
      interval: 2s
      timeout: 5s
      retries: 30

  server:
    build:
      context: .
      dockerfile: Dockerfile
    restart: unless-stopped
    command: ["serve"]
    environment:
      NORNRUNE_HTTP_ADDRESS: 0.0.0.0:8080
      NORNRUNE_GRPC_ADDRESS: 0.0.0.0:9090
      NORNRUNE_DATABASE_URL: postgresql://nornrune_runtime:${NORNRUNE_RUNTIME_PASSWORD:-nornrune-runtime-local}@postgres:5432/${POSTGRES_DB:-nornrune}?sslmode=disable
      NORNRUNE_DATABASE_CONNECT_TIMEOUT: 30s
      NORNRUNE_AUDIT_MODE: required
      NORNRUNE_AUDIT_WRITE_TIMEOUT: 10s
      NORNRUNE_AUDIT_WRITERS: 1
      NORNRUNE_AUDIT_QUEUE_DEPTH: 4
      NORNRUNE_WORKERS: 2
      NORNRUNE_QUEUE_DEPTH: 8
      NORNRUNE_MAX_BATCH_ROWS: 16
      NORNRUNE_MAX_BODY_BYTES: 1048576
    ports:
      - "127.0.0.1:${NORNRUNE_HTTP_PORT:-8080}:8080"
      - "127.0.0.1:${NORNRUNE_GRPC_PORT:-9090}:9090"
    depends_on:
      migrate:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "/nornrune", "healthcheck"]
      interval: 2s
      timeout: 5s
      retries: 30
      start_period: 2s
    stop_grace_period: 30s

  debug:
    profiles: ["debug"]
    build:
      context: .
      dockerfile: Dockerfile.debug
    command: ["serve"]
    environment:
      NORNRUNE_HTTP_ADDRESS: 0.0.0.0:8080
      NORNRUNE_GRPC_ADDRESS: 0.0.0.0:9090
      NORNRUNE_DATABASE_URL: postgresql://nornrune_runtime:${NORNRUNE_RUNTIME_PASSWORD:-nornrune-runtime-local}@postgres:5432/${POSTGRES_DB:-nornrune}?sslmode=disable
      NORNRUNE_DATABASE_CONNECT_TIMEOUT: 30s
      NORNRUNE_AUDIT_MODE: required
      NORNRUNE_AUDIT_WRITE_TIMEOUT: 10s
      NORNRUNE_AUDIT_WRITERS: 1
      NORNRUNE_AUDIT_QUEUE_DEPTH: 2
      NORNRUNE_WORKERS: 1
      NORNRUNE_QUEUE_DEPTH: 4
      NORNRUNE_MAX_BATCH_ROWS: 16
      NORNRUNE_MAX_BODY_BYTES: 1048576
    ports:
      - "127.0.0.1:${NORNRUNE_DEBUG_PORT:-40000}:40000"
    depends_on:
      migrate:
        condition: service_healthy
    cap_add:
      - SYS_PTRACE
    security_opt:
      - seccomp:unconfined

volumes:
  postgres-data:
