version: v2
plugins:
  - remote: buf.build/protocolbuffers/go:v1.36.12
    revision: 1
    out: .
    opt:
      - module=github.com/sebishogun/nornrune
  - local: .nornrune/tools/protoc-gen-nornrune
    out: .
    opt:
      - module=github.com/sebishogun/nornrune
    types:
      - nornrune.frontend.fixture.PolicyRequest
inputs:
  - directory: .
    paths:
      - frontend/proto/options.proto
      - testdata/frontends/proto/policy.proto
