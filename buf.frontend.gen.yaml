version: v2
plugins:
  - remote: buf.build/protocolbuffers/go:v1.36.12
    revision: 1
    out: .
    opt:
      - module=github.com/sebishogun/verifoxx
  - local: .verifoxx/tools/protoc-gen-verifoxx
    out: .
    opt:
      - module=github.com/sebishogun/verifoxx
    types:
      - verifoxx.frontend.fixture.PolicyRequest
inputs:
  - directory: .
    paths:
      - frontend/proto/options.proto
      - testdata/frontends/proto/policy.proto
