syntax = "proto3";

package nornrune.frontend.fixture;

import "options.proto";

option go_package = "github.com/sebishogun/nornrune/testdata/frontends/proto;policy";

message PolicyRequest {
  option (nornrune.frontend.policy_name) = "access-policy";
  option (nornrune.frontend.policy_version) = "v1";
  option (nornrune.frontend.cel_expression) = "teamName == \"blue\" && count >= 2 && enabled";

  string team_name = 1 [json_name = "teamName", (nornrune.frontend.canonical_target) = "subject.team"];
  sint64 count = 2 [(nornrune.frontend.canonical_target) = "context.count"];
  bool enabled = 3 [(nornrune.frontend.canonical_target) = "context.enabled"];
}
