version: 2

project_name: nornrune

before:
  hooks:
    - go mod download

builds:
  - id: nornrune
    main: ./cmd/nornrune
    binary: nornrune
    env:
      - CGO_ENABLED=0
    flags:
      - -buildvcs=false
      - -trimpath
    ldflags:
      - -s -w -X github.com/sebishogun/nornrune/internal/buildinfo.version={{.Version}}
    goos:
      - linux
      - darwin
    goarch:
      - amd64
      - arm64

archives:
  - id: release
    formats:
      - tar.gz
    name_template: "{{ .ProjectName }}_{{ .Version }}_{{ .Os }}_{{ .Arch }}"
    files:
      - LICENSE
      - NOTICE
      - README.md
      - SECURITY.md

checksum:
  name_template: checksums.txt

changelog:
  sort: asc
  filters:
    exclude:
      - '^docs:'
      - '^test:'
