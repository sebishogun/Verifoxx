version: 2

project_name: verifoxx

before:
  hooks:
    - go mod download

builds:
  - id: verifoxx
    main: ./cmd/verifoxx
    binary: verifoxx
    env:
      - CGO_ENABLED=0
    flags:
      - -buildvcs=false
      - -trimpath
    ldflags:
      - -s -w -X github.com/sebishogun/verifoxx/internal/buildinfo.version={{.Version}}
    goos:
      - linux
      - darwin
    goarch:
      - amd64
      - arm64

archives:
  - id: release
    formats:
      - tar.gz
    name_template: "{{ .ProjectName }}_{{ .Version }}_{{ .Os }}_{{ .Arch }}"

checksum:
  name_template: checksums.txt

changelog:
  sort: asc
  filters:
    exclude:
      - '^docs:'
      - '^test:'
